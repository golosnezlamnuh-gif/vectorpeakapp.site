<main id="main" class="page">
  <div class="top"><h1>Search shows</h1></div>
  <form class="q" id="search-form" role="search">
    <label class="sr" for="q">Show title</label>
    <input id="q" type="search" name="q" placeholder="Search for a show" autocomplete="off" enterkeyhint="search">
    <button class="btn btn--solid" type="submit">Search</button>
  </form>
  <div id="results" aria-live="polite"></div>
  <noscript><div class="state"><h2>Turn on JavaScript to search</h2><p>Search queries TVmaze live, which needs JavaScript.</p></div></noscript>
</main>
