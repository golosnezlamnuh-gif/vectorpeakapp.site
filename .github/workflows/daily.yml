# Rebuilds the site and saves the result in the repository.
# It runs every day (new listings), every time you add or change a guide, a note, the settings or the site code,
# and when you press "Run workflow" on the Actions tab. Cloudflare redeploys on every commit.
name: Daily update
on:
  schedule:
    - cron: "20 6 * * *"   # 06:20 UTC, shortly after the US broadcast day has started
  push:
    branches: [main]
    paths:
      - "content/**"
      - "site.config.json"
      - "src/**"
      - "tools/**"
      - "prompts/**"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        run: node tools/build.mjs --daily
      - name: Commit and push if anything changed
        run: |
          git config user.name "daily-update"
          git config user.email "daily-update@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Site update $(date -u +%F) (${{ github.event_name }})"
            git push || (git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
          fi
