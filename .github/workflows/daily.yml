name: Daily update
on:
  schedule:
    - cron: "20 6 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: daily-update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build today's pages
        run: node tools/build.mjs --daily
      - name: Commit and push if anything changed
        run: |
          git config user.name "daily-update"
          git config user.email "daily-update@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Daily update $(date -u +%F)"
            git push
          fi
